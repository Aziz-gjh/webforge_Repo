<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc"><title id="title">AlUla Site Tours system diagram</title><desc id="desc">React connects to Google authentication and Firestore protected by security rules. Vercel Cron calls the authenticated Reminder function, which reads Bookings and sends email through Resend. Cloudflare manages DNS.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e4bf7c"/></marker></defs><rect width="1600" height="1180" fill="#101722"/>
