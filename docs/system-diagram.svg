<text x="80" y="849.3" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">No secrets in browser code</text>
<rect x="650" y="900" width="380" height="140" rx="12" fill="#182230" stroke="#e4bf7c" stroke-width="2"/>
