<text x="80" y="540.0" fill="#e4bf7c" font-family="Arial,sans-serif" font-size="22">Vercel Cron · daily</text>
<text x="80" y="573.0" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">0 15 * * * UTC · about 18:00 Riyadh</text>
<text x="80" y="595.1" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Authorization: Bearer CRON_SECRET</text>
