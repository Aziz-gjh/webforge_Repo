<text x="670" y="1017.2" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Retry idempotency + email delivery</text>
<rect x="60" y="940" width="400" height="130" rx="12" fill="#182230" stroke="#e4bf7c" stroke-width="2"/>
<text x="80" y="980.0" fill="#e4bf7c" font-family="Arial,sans-serif" font-size="22">Cloudflare DNS</text>
<text x="80" y="1013.0" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">App CNAME → Vercel · DNS only</text>
<text x="80" y="1035.1" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Email verification records → Resend</text>
<text x="80" y="1057.2" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Search Console verification TXT</text>
<text x="480" y="202.0" fill="#b8c0ca" font-family="Arial,sans-serif" font-size="14">Google sign-in</text>
<text x="480" y="274.0" fill="#b8c0ca" font-family="Arial,sans-serif" font-size="14">Transactions +</text>
<text x="480" y="292.2" fill="#b8c0ca" font-family="Arial,sans-serif" font-size="14">live snapshots</text>
<text x="1040" y="547.0" fill="#b8c0ca" font-family="Arial,sans-serif" font-size="14">enforced</text>
<text x="282" y="664.0" fill="#b8c0ca" font-family="Arial,sans-serif" font-size="14">daily GET</text>
<text x="470" y="794.0" fill="#b8c0ca" font-family="Arial,sans-serif" font-size="14">Admin: read Bookings</text>
<text x="470" y="812.2" fill="#b8c0ca" font-family="Arial,sans-serif" font-size="14">write reminderSentFor</text>
<text x="520" y="834.0" fill="#b8c0ca" font-family="Arial,sans-serif" font-size="14">Reminder email</text>
<text x="282" y="913.0" fill="#b8c0ca" font-family="Arial,sans-serif" font-size="14">DNS only</text>
<text x="60" y="72.0" fill="#e4bf7c" font-family="Arial,sans-serif" font-size="32">ALULA SITE TOURS // SYSTEM MAP</text>
