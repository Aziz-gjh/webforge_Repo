<text x="670" y="470.0" fill="#e4bf7c" font-family="Arial,sans-serif" font-size="22">Firestore</text>
<text x="670" y="503.0" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">sites + settings/schedule</text>
<text x="670" y="525.1" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">users + providers</text>
<text x="670" y="547.2" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">bookings · private Customer details</text>
<text x="670" y="569.3" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">slotLocks · bookingId, date, hour</text>
<text x="670" y="591.4" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17"></text>
