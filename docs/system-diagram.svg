<text x="80" y="750.0" fill="#e4bf7c" font-family="Arial,sans-serif" font-size="22">Vercel</text>
<text x="80" y="783.0" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Vite static app + app-route rewrites</text>
