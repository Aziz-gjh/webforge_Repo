<text x="670" y="213.0" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Google popup sign-in</text>
<text x="670" y="235.1" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Verified Google accounts</text>
<text x="670" y="257.2" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Provider role: providers/{uid}</text>
