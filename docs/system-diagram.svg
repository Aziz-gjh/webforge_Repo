<text x="80" y="235.1" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Book · Reschedule · Cancel</text>
<text x="80" y="257.2" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Provider Schedule + live updates</text>
