<text x="1150" y="591.4" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Verified Google sign-in required</text>
<text x="1150" y="613.5" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Locks: create only, never overwrite</text>
<text x="1150" y="635.6" fill="#f4f0e7" font-family="Arial,sans-serif" font-size="17">Rules enforce browser permissions</text>
